<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLACK ROCK - Create New Password</title>
<link rel="stylesheet" href="style.css">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Book Antiqua", Palatino, "Palatino Linotype", "Palatino LT STD", Georgia, serif !important;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 14% 16%, rgba(255, 255, 255, 0.72), transparent 38%),
        radial-gradient(circle at 88% 84%, rgba(184, 153, 116, 0.18), transparent 40%),
        #e8ddc8 !important;
    background-attachment: fixed !important;
    color: #30271f !important;
    padding: 24px 16px;
}

.card {
    width: 100%;
    max-width: 440px;
    padding: 38px 34px;
    border-radius: 22px;
    background: rgba(250, 247, 240, 0.96) !important;
    border: 1px solid #dfd2bf !important;
    box-shadow: 0 16px 40px rgba(73, 54, 35, 0.12), 0 2px 8px rgba(73, 54, 35, 0.05) !important;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}

.back-btn-top {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #795039 !important;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 20px;
    padding: 6px 14px;
    border-radius: 8px;
    background: #eee3d2 !important;
    border: 1px solid rgba(138, 91, 61, 0.22) !important;
    transition: all 0.2s ease;
}

.back-btn-top:hover {
    background: #e3d3bd !important;
    color: #68432f !important;
}

.logo {
    text-align: center;
    margin-bottom: 24px;
}

.logo-icon {
    width: 58px;
    height: 58px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #eee3d2 !important;
    color: #795039 !important;
    border: 1px solid rgba(138, 91, 61, 0.28) !important;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 6px 16px rgba(105, 72, 45, 0.12);
}

.logo h1 {
    font-size: 22px;
    letter-spacing: 2px;
    color: #30271f;
    margin-bottom: 4px;
}

.logo p {
    color: #75695b !important;
    font-size: 12px;
    letter-spacing: 1px;
}

h2 {
    text-align: center;
    margin-bottom: 8px;
    font-size: 20px;
    color: #30271f;
}

.subtitle {
    text-align: center;
    color: #75695b !important;
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.5;
}

.account-badge {
    text-align: center;
    font-size: 12px;
    color: #68432f;
    margin-bottom: 18px;
    padding: 8px 12px;
    background: #f1e9dc;
    border-radius: 8px;
    border: 1px solid #dfd2bf;
    word-break: break-all;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #5f4a38 !important;
    font-size: 12px;
    font-weight: 700;
}

.input-group {
    margin-bottom: 18px;
    position: relative;
}

.input {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border-radius: 10px;
    background: #fffdf8 !important;
    border: 1px solid #dfd2bf !important;
    color: #30271f !important;
    outline: none;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.input:focus {
    border-color: #795039 !important;
    box-shadow: 0 0 0 3px rgba(121, 80, 57, 0.12);
}

.input-with-toggle {
    padding-right: 56px !important;
}

.pwd-toggle {
    position: absolute;
    right: 12px;
    top: 36px;
    background: transparent !important;
    border: none !important;
    color: #795039 !important;
    font-size: 12px !important;
    font-weight: 600 !important;
    cursor: pointer;
    box-shadow: none !important;
    padding: 4px 6px;
    width: auto !important;
    height: auto !important;
}

.pwd-toggle:hover {
    color: #4a2f20 !important;
    background: transparent !important;
    transform: none !important;
}

button.submit-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #795039, #966a49) !important;
    color: #fffaf1 !important;
    box-shadow: 0 4px 14px rgba(121, 80, 57, 0.22);
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-top: 6px;
}

button.submit-btn:hover {
    background: linear-gradient(135deg, #68432f, #8a5b3d) !important;
    box-shadow: 0 6px 18px rgba(105, 72, 45, 0.28);
    transform: translateY(-1px);
}

.message {
    display: none;
    text-align: center;
    font-size: 13px;
    line-height: 1.5;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 18px;
    word-break: break-word;
}

.message.show {
    display: block;
}

.message.success {
    display: block;
    background: #edf3e8 !important;
    border: 1px solid #cbd9c1 !important;
    color: #355330 !important;
}

.message.error {
    display: block;
    background: #f8e9e4 !important;
    border: 1px solid #e8c4ba !important;
    color: #8c3029 !important;
}

.password-rules {
    font-size: 11px;
    color: #75695b;
    margin-top: -10px;
    margin-bottom: 16px;
    line-height: 1.4;
}

.back {
    text-align: center;
    margin-top: 22px;
}

.back a {
    color: #795039 !important;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
}

.back a:hover {
    text-decoration: underline;
    color: #5f4130 !important;
}
</style>
</head>

<body>

<div class="card">

    <a href="login.html" class="back-btn-top">
        ← Back to Login
    </a>

    <div class="logo">
        <div class="logo-icon">BR</div>
        <h1>BLACK ROCK</h1>
        <p>Secure Access Gateway</p>
    </div>

    <h2>Create New Password</h2>
    <p class="subtitle">
        Set a new secure password for your account
    </p>

    <div id="emailBadge" class="account-badge" style="display:none;"></div>

    <div id="passwordMessage" class="message"></div>

    <form id="resetForm" onsubmit="handleResetPassword(event)">
        <div class="input-group" id="emailGroup">
            <label for="emailInput">Registered Email Address</label>
            <input
                type="email"
                id="emailInput"
                class="input"
                placeholder="name@example.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="input-group">
            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                class="input input-with-toggle"
                placeholder="Enter new password (min. 6 characters)"
                minlength="6"
                required
            >
            <button type="button" class="pwd-toggle" onclick="toggleVisibility('newPassword', this)">Show</button>
        </div>

        <div class="input-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                class="input input-with-toggle"
                placeholder="Re-enter your new password"
                minlength="6"
                required
            >
            <button type="button" class="pwd-toggle" onclick="toggleVisibility('confirmPassword', this)">Show</button>
        </div>

        <p class="password-rules">Password must be at least 6 characters long.</p>

        <button type="submit" id="submitBtn" class="submit-btn">
            UPDATE PASSWORD
        </button>
    </form>

    <div class="back">
        <a href="login.html">
            ← Back to Login
        </a>
    </div>

</div>

<script>
let queryEmail = new URLSearchParams(window.location.search).get("email");

document.addEventListener("DOMContentLoaded", () => {
    if (queryEmail) {
        queryEmail = queryEmail.trim().toLowerCase();
        document.getElementById("emailInput").value = queryEmail;
        document.getElementById("emailGroup").style.display = "none";
        const badge = document.getElementById("emailBadge");
        badge.innerHTML = `Account: <strong>${queryEmail}</strong>`;
        badge.style.display = "block";
    }
});

function toggleVisibility(inputId, btn) {
    const field = document.getElementById(inputId);
    if (!field) return;
    if (field.type === "password") {
        field.type = "text";
        btn.textContent = "Hide";
    } else {
        field.type = "password";
        btn.textContent = "Show";
    }
}

function handleResetPassword(event) {
    if (event) event.preventDefault();

    const email = (queryEmail || document.getElementById("emailInput").value).trim().toLowerCase();
    const newPass = document.getElementById("newPassword").value;
    const confirmPass = document.getElementById("confirmPassword").value;
    const msg = document.getElementById("passwordMessage");
    const btn = document.getElementById("submitBtn");

    if (!email) {
        msg.className = "message error show";
        msg.innerText = "Please provide your email address.";
        return;
    }

    if (!newPass || newPass.length < 6) {
        msg.className = "message error show";
        msg.innerText = "Password must be at least 6 characters long.";
        return;
    }

    if (newPass !== confirmPass) {
        msg.className = "message error show";
        msg.innerText = "Passwords do not match. Please re-enter.";
        return;
    }

    btn.disabled = true;

    try {
        let users = [];
        try {
            users = JSON.parse(localStorage.getItem("blackrockUsers")) || [];
        } catch (e) {
            users = [];
        }

        const userIndex = users.findIndex(u =>
            u && typeof u.email === "string" &&
            u.email.trim().toLowerCase() === email
        );

        if (userIndex !== -1) {
            users[userIndex].password = newPass;
        } else {
            users.push({
                name: email.split("@")[0],
                email: email,
                password: newPass,
                role: "USER",
                mfa: "Enabled"
            });
        }

        localStorage.setItem("blackrockUsers", JSON.stringify(users));
        localStorage.setItem("users", JSON.stringify(users));

        msg.className = "message success show";
        msg.innerHTML = `<strong>Password updated successfully!</strong><br>Redirecting to sign in...`;

        setTimeout(() => {
            window.location.href = "login.html?reset=true";
        }, 1200);
    } catch (err) {
        console.error("Failed to reset password:", err);
        msg.className = "message error show";
        msg.innerText = "Failed to update password. Please try again.";
        btn.disabled = false;
    }
}
</script>

</body>
</html>
